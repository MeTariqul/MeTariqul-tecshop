{% extends 'admin/base.html' %}

{% block admin_title %}{% if supplier %}Edit{% else %}Add{% endif %} Supplier{% endblock %}

{% block admin_content %}
<div class="page-header">
    <h4><i class="bi bi-building me-2" style="color:#4f46e5;"></i>{% if supplier %}Edit{% else %}Add{% endif %} Supplier</h4>
    <a href="{% url 'admin_dashboard:suppliers' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Suppliers</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="admin-card">
            <div class="card-body-custom">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Supplier Code</label>
                        <input type="text" name="code" class="form-control" value="{{ supplier.code|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ supplier.name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact Person</label>
                        <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person|default:'' }}">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ supplier.phone|default:'' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ supplier.email|default:'' }}">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" style="resize:vertical;">{{ supplier.address|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2" style="resize:vertical;">{{ supplier.notes|default:'' }}</textarea>
                    </div>
                    <div class="form-check mb-4">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if supplier.is_active or not supplier %}checked{% endif %} style="border-color:#c7d2fe;">
                        <label class="form-check-label" for="is_active" style="font-weight:500;color:#475569;">Active</label>
                    </div>
                    <div style="border-top:1px solid #e2e8f0;padding-top:20px;display:flex;gap:12px;">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Supplier</button>
                        <a href="{% url 'admin_dashboard:suppliers' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

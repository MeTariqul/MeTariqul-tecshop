{% extends "admin/base.html" %}
{% load static %}

{% block title %}
{{ title }} | {{ site_title|default:_('TechShop Admin') }}
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color:#4f46e5;font-family:'Outfit',sans-serif;font-weight:700;text-decoration:none;">
        TechShop Admin
    </a>
</h1>
{% endblock %}

{% block welcome-msg %}
<p class="welcome" style="font-family:'Inter',sans-serif;">
    <span style="color:#475569;">Logged in as <strong style="color:#0f172a;">{{ user.username }}</strong></span>
</p>
{% endblock %}

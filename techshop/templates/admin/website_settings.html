{% extends 'admin/base.html' %}

{% block admin_title %}Website Settings{% endblock %}

{% block admin_content %}
<div class="page-header">
    <h4><i class="bi bi-sliders me-2" style="color:#4f46e5;"></i>Website Settings</h4>
    <a href="{% url 'admin_dashboard:dashboard' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Dashboard</a>
</div>

<form method="post">
    {% csrf_token %}

    <!-- General -->
    <div class="admin-card mb-4">
        <div class="card-header-custom"><i class="bi bi-gear"></i> General Settings</div>
        <div class="card-body-custom">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Site Name</label><input type="text" name="site_name" class="form-control" value="{{ config.site_name }}"></div>
                <div class="col-md-6"><label class="form-label">Currency Short Form</label><input type="text" name="currency_short_form" class="form-control" value="{{ config.currency_short_form }}" placeholder="e.g., Tk, $"></div>
                <div class="col-md-6"><label class="form-label">Contact Email</label><input type="email" name="contact_email" class="form-control" value="{{ config.contact_email }}"></div>
                <div class="col-md-6"><label class="form-label">Contact Phone</label><input type="text" name="contact_phone" class="form-control" value="{{ config.contact_phone }}"></div>
                <div class="col-md-6"><label class="form-label">Notification Email</label><input type="email" name="notification_email" class="form-control" value="{{ config.notification_email }}"></div>
            </div>
        </div>
    </div>

    <!-- Reviews -->
    <div class="admin-card mb-4">
        <div class="card-header-custom"><i class="bi bi-chat-square-text"></i> Product Reviews</div>
        <div class="card-body-custom">
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="reviews_enabled" name="reviews_enabled" {% if config.reviews_enabled %}checked{% endif %}><label class="form-check-label" for="reviews_enabled" style="color:#475569;">Enable Product Reviews</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="require_approval" name="require_approval_for_reviews" {% if config.require_approval_for_reviews %}checked{% endif %}><label class="form-check-label" for="require_approval" style="color:#475569;">Require Admin Approval</label></div>
        </div>
    </div>

    <!-- Order -->
    <div class="admin-card mb-4">
        <div class="card-header-custom"><i class="bi bi-cart-check"></i> Order Settings</div>
        <div class="card-body-custom">
            <div class="row g-3 mb-3">
                <div class="col-md-6"><label class="form-label">Default Order Status</label>
                    <select name="default_order_status" class="form-select">
                        <option value="pending" {% if config.default_order_status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="confirmed" {% if config.default_order_status == 'confirmed' %}selected{% endif %}>Confirmed</option>
                        <option value="processing" {% if config.default_order_status == 'processing' %}selected{% endif %}>Processing</option>
                    </select>
                </div>
                <div class="col-md-6"><label class="form-label">Auto-cancel Unpaid (hours)</label><input type="number" name="auto_cancel_hours" class="form-control" value="{{ config.auto_cancel_hours }}" min="1"></div>
            </div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="auto_cancel" name="auto_cancel_unpaid_orders" {% if config.auto_cancel_unpaid_orders %}checked{% endif %}><label class="form-check-label" for="auto_cancel" style="color:#475569;">Enable Auto-cancel for Unpaid Orders</label></div>
        </div>
    </div>

    <!-- Email -->
    <div class="admin-card mb-4">
        <div class="card-header-custom"><i class="bi bi-envelope"></i> Email Notifications</div>
        <div class="card-body-custom">
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="email_enabled" name="email_notifications_enabled" {% if config.email_notifications_enabled %}checked{% endif %}><label class="form-check-label" for="email_enabled" style="color:#475569;">Enable Email Notifications</label></div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="notify_order" name="notify_new_order" {% if config.notify_new_order %}checked{% endif %}><label class="form-check-label" for="notify_order" style="color:#475569;">Notify on new order</label></div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="notify_status" name="notify_order_status_change" {% if config.notify_order_status_change %}checked{% endif %}><label class="form-check-label" for="notify_status" style="color:#475569;">Notify customers on status change</label></div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="notify_review" name="notify_new_review" {% if config.notify_new_review %}checked{% endif %}><label class="form-check-label" for="notify_review" style="color:#475569;">Notify on new review</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="notify_stock" name="notify_low_stock" {% if config.notify_low_stock %}checked{% endif %}><label class="form-check-label" for="notify_stock" style="color:#475569;">Notify on low stock</label></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="admin-card mb-4">
        <div class="card-header-custom"><i class="bi bi-layout-text-window-reverse"></i> Dashboard Display</div>
        <div class="card-body-custom">
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="show_health" name="show_system_health" {% if config.show_system_health %}checked{% endif %}><label class="form-check-label" for="show_health" style="color:#475569;">Show System Health Metrics</label></div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="show_db" name="show_database_status" {% if config.show_database_status %}checked{% endif %}><label class="form-check-label" for="show_db" style="color:#475569;">Show Database Connection Status</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="enable_backup" name="enable_database_backup" {% if config.enable_database_backup %}checked{% endif %}><label class="form-check-label" for="enable_backup" style="color:#475569;">Enable Database Backup Download</label></div>
        </div>
    </div>

    <div class="text-end"><button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Settings</button></div>
</form>
{% endblock %}
